<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bc591b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/app.css">
    <!--ssr-head-->
    <script>
      const match = document.cookie.match(/app-theme=([^;]+)/);
      if (match) {
        try {
          const mode = JSON.parse(decodeURIComponent(match[1])).mode;
          if (mode && mode !== 'system') document.documentElement.dataset.theme = mode;
        } catch {}
      }
    </script>
  </head>
  <body>
    <div id="root" style="display: contents;"><!--ssr-outlet--></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
