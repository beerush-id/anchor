name = "air-react"
main = "./server/worker.js"
compatibility_date = "2024-06-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
html_handling = "drop-trailing-slash"

[durable_objects]
bindings = [
  { name = "DURABLE_LINK", class_name = "AirDurableLink" }
]

[[migrations]]
tag = "v1"
new_classes = ["AirDurableLink"]
