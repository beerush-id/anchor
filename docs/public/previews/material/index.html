<!DOCTYPE html>
<html>
<head>
  <title>AIR M3 CSS</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@airlib/material@1.0.4/dist/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --seed-color: #e6611a;
    }
  </style>
</head>
<body class="w-screen h-screen p-8 flex flex-col items-center justify-center bg-transparent">
  <div class="card w-full max-w-lg">
    <div class="card-header">
      <h2 class="card-title">AIR Material 3 Utilities</h2>
      <p class="body-medium text-on-surface-variant">CSS only, TailwindCSS v4 utilities for the Expressive Material Design 3 system.</p>
    </div>

    <div class="card-body flex flex-col gap-4">
      <div class="text-field w-full">
        <input type="text" class="text-field-input" placeholder=" " value="john@doe.com" />
        <label class="text-field-label">Email Address</label>
      </div>

      <div class="text-field w-full">
        <input type="password" class="text-field-input-filled" placeholder=" " value="password123" />
        <label class="text-field-label">Password</label>
      </div>

      <div class="flex items-center gap-4 mt-2">
        <button class="switch" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true')">
          <span class="switch-thumb"></span>
        </button>
        <span class="text-body-medium text-on-surface-variant">Remember me</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="card-body flex flex-wrap gap-3">
      <button class="chip" aria-selected="true">Developer</button>
      <button class="chip">Designer</button>
      <button class="chip">Manager</button>
    </div>

    <div class="card-actions">
      <button class="button-text">Cancel</button>
      <button class="button">Save Profile</button>
    </div>
  </div>
</body>
</html>
